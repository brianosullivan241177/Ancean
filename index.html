<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Ancean</title>
  <style>
    :root{--bg1:#081229;--bg2:#0b3a59;--card:#012233;--accent:#1db4ff;--muted:#9fcfe8}
    html,body{height:100%;margin:0}
    body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,var(--bg1),var(--bg2));color:#eaf7ff}
    .card{background:linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01)); padding:36px;border-radius:14px;box-shadow:0 10px 40px rgba(2,6,23,0.6);max-width:820px;text-align:center}
    h1{margin:0 0 8px;font-size:2.4rem;letter-spacing:-0.02em}
    p{margin:0 0 18px;color:#cdeffb}
    .btn{display:inline-block;padding:10px 18px;border-radius:10px;background:var(--accent);color:#002233;text-decoration:none;font-weight:700}
    footer{margin-top:18px;font-size:0.9rem;color:var(--muted)}
    @media (max-width:520px){.card{padding:22px}h1{font-size:1.6rem}}
  </style>
</head>
<body>
  <div class="card" role="main">
    <h1>Ancean</h1>
    <p>Building ocean-scale technology — clean, secure, and ready to scale.</p>
    <a class="btn" href="https://github.com/brianosullivan241177/ancean" target="_blank" rel="noopener">View on GitHub</a>
    <footer>Project page • © <span id="year"></span></footer>
  </div>
  <script>document.getElementById('year').textContent = new Date().getFullYear();</script>
</body>
</html>
