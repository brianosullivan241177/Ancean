<!doctype html>
<html lang="en" class="h-full">
 <head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>App Showcase</title>
  <script src="/_sdk/element_sdk.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&amp;display=swap" rel="stylesheet">
  <style>
    body {
      box-sizing: border-box;
    }
    
    * {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    }
    
    .gradient-bg {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    }
    
    .image-placeholder {
      background: linear-gradient(135deg, rgba(102, 126, 234, 0.1) 0%, rgba(118, 75, 162, 0.1) 100%);
      border: 2px dashed rgba(102, 126, 234, 0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 280px;
      border-radius: 16px;
      transition: all 0.3s ease;
    }
    
    .image-placeholder img {
      width: 100%;
      border-radius: 16px;
    }
  </style>
 </head>
 <body class="h-full">
  <div class="w-full h-full overflow-auto">
   <!-- Hero Section -->
   <div class="gradient-bg w-full py-20 px-6">
    <div class="max-w-4xl mx-auto text-center">
     <h1 id="app-title" class="text-white mb-4" style="font-size: 3em; font-weight: 700; line-height: 1.2;">AnCeAn</h1>
     <p id="app-tagline" class="text-white mb-8" style="font-size: 1.25em; opacity: 0.95;">App Design by Brian O'Sullivan</p>
     <button id="cta-button" class="cta-button text-white px-8 py-4 rounded-full" style="font-size: 1.1em; font-weight: 600; background-color: #4f46e5;">Get Started</button>
    </div>
   </div>

   <!-- Screenshot Section -->
   <div class="w-full py-16 px-6" style="background-color: #f9fafb;">
    <div class="max-w-6xl mx-auto">
     <h2 class="text-center mb-12" style="font-size: 2.25em; font-weight: 700; color: #1f2937;">See It In Action</h2>
     <div class="image-placeholder">
       <img src="https://raw.githubusercontent.com/brianosullivan241177/Ancean/main/image0.png" alt="Screenshot">
     </div>
    </div>
   </div>

   <!-- Footer -->
   <div class="w-full py-12 px-6" style="background-color: #1f2937;">
    <div class="max-w-4xl mx-auto text-center">
     <p style="color: #9ca3af; font-size: 0.95em;">© 2024 Your App Name. All rights reserved.</p>
    </div>
   </div>
  </div>
 </body>
</html>
